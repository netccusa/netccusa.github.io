<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request LOA | NETC Portal</title>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    body { 
      font-family: 'Segoe UI', sans-serif; padding: 20px; text-align: center; 
      background: linear-gradient(rgba(0, 18, 38, 0.9), rgba(0, 18, 38, 0.9)), url('bckgr3.png');
      background-size: cover; background-position: center; background-attachment: fixed;
      color: white; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; 
    }
    .nav-links { width: 100%; max-width: 550px; display: flex; justify-content: flex-start; margin-bottom: 20px; animation: fadeIn 0.8s ease-out forwards; }
    .btn-back { padding: 8px 16px; background-color: rgba(255, 255, 255, 0.1); color: #e2b13c; border: 1px solid #e2b13c; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 13px; text-transform: uppercase; transition: 0.3s; font-weight: bold; }
    .btn-back:hover { background-color: #e2b13c; color: #001226; }
    .form-container { 
      background: rgba(0, 30, 60, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 40px; border-radius: 8px; border-top: 3px solid #e2b13c; width: 100%; max-width: 500px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); animation: fadeIn 1.2s ease-out forwards; text-align: left;
    }
    h1 { text-transform: uppercase; letter-spacing: 2px; color: #e2b13c; margin-top: 0; font-size: 24px; text-align: center; }
    label { display: block; margin-top: 20px; font-size: 11px; color: #e2b13c; text-transform: uppercase; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 12px; margin-top: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(226, 177, 60, 0.3); color: white; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    .submit-btn { width: 100%; padding: 15px; background: #e2b13c; color: #001226; border: none; font-weight: bold; margin-top: 30px; cursor: pointer; text-transform: uppercase; transition: 0.3s; border-radius: 4px; }
    .submit-btn:hover { background: #f3c75f; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="nav-links"><a href="dashboard.html" class="btn-back">← Back to Dashboard</a></div>
  <div class="form-container">
    <h1>LOA and QUOTA Reduction Request</h1>
    <label>Reason for Reduction / Leave</label>
    <textarea id="loaReason" rows="3" placeholder="e.g. Personal reasons / Exams / Vacation"></textarea>
    
    <label>Duration / End Date</label>
    <input type="text" id="loaDuration" placeholder="e.g. 1 Week / Until Jan 20th / Permanent">

    <label>Requested Quota Reduction (%)</label>
    <select id="loaReduction">
        <option value="25">25% Reduction</option>
        <option value="50">50% Reduction</option>
        <option value="75">75% Reduction</option>
        <option value="100">100% (Full Exemption / LOA)</option>
    </select>

    <button id="submitBtn" class="submit-btn">Submit LOA Request</button>
    <p id="status" style="font-size:12px; margin-top:15px; text-align: center; color: #e2b13c;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from './config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("submitBtn").onclick = async () => {
      const reason = document.getElementById("loaReason").value;
      const duration = document.getElementById("loaDuration").value;
      const reduction = document.getElementById("loaReduction").value;
      const user = auth.currentUser;

      if (!reason || !duration) return alert("Please fill all fields.");

      document.getElementById("submitBtn").disabled = true;
      document.getElementById("status").textContent = "SUBMITTING REQUEST...";

      try {
        await addDoc(collection(db, "loa_pending"), {
          hostEmail: user.email.toLowerCase(),
          reason: reason,
          duration: duration,
          reductionPercent: parseInt(reduction),
          submittedAt: new Date(),
          status: "Pending"
        });
        alert("LOA Request Submitted.");
        window.location.href = "dashboard.html";
      } catch (e) {
        alert("Error: " + e.message);
        document.getElementById("submitBtn").disabled = false;
      }
    };
  </script>
</body>
</html>
